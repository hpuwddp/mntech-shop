server:
  port: 8082  # 网关服务端口，避免与 order 模块冲突
  tomcat:
    threads:
      max: 30
      min-spare: 10
    accept-count: 50
    connection-timeout: 10000
spring:
  application:
    name: order-service  # 这个很重要，是服务注册到 Nacos 的名称
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://172.17.0.1:5432/shopdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: xxx
    password: xxxxxx
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池配置
      initial-size: 10
      min-idle: 5
      max-active: 20
      max-wait: 3000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  redis:
    host: ${REDIS_HOST:localhost}  # ✅ 支持环境变量，默认 localhost
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 1000ms

  # MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.mntech.shop.order.model
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
# ✅ 关闭所有 DEBUG 日志
logging:
  level:
    root: INFO
    com.mntech: INFO
    org.springframework: WARN
    org.apache: WARN
    org.mybatis: WARN
    com.alibaba: WARN
    org.apache.rocketmq: WARN
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN
    # ✅ 强制关闭 MyBatis SQL 日志
    com.mntech.shop.order.dao: WARN
    com.mntech.shop.order.mapper: WARN
