# 消费模式，默认集群
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 清除未被消费消息时间,凌晨四点
deleteWhen = 04
#消息保留时间
fileReservedTime = 48
#broker角色，默认为异步MASTER
brokerRole = ASYNC_MASTER
#刷盘策略，异步刷盘
flushDiskType = ASYNC_FLUSH
# 公网注册地址（客户端从namesrv拿到这个地址连接broker）
brokerIP1 = xxxx
# ========== 新增1：容器内监听所有网卡，不要绑定公网IP监听 ==========
listenPort=10911
# ========== 新增2：关闭VIP通道【重中之重】==========
vipChannelEnabled=false
#是否允许自动创建topic
autoCreateTopicEnable=true