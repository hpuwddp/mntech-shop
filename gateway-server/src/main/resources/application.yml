server:
  port: 8081  # 网关服务端口，避免与 order 模块冲突

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848  # 注册到 Nacos
        group: PAY_GROUP
    gateway:
      discovery:
        locator:
          enabled: true               # 开启通过服务名动态路由
          lower-case-service-id: true # 服务名转为小写
      routes:
        - id: order-service-route     # 路由 ID，唯一即可
          uri: lb://order-service     # lb:// 表示从 Nacos 中按服务名负载均衡
          predicates:
            - Host=www.xxxx.xxxx
            - Path=/order/**          # 匹配以 /order/ 开头的请求
          filters:
            - StripPrefix=1           # 去掉第一层路径，即 /order 会被移除再转发
##            - name: RequestRateLimiter
##              args:
##                redis-rate-limiter.replenishRate: 10  # 每秒允许的请求数
##                redis-rate-limiter.burstCapacity: 20  # 突发容量
##                redis-rate-limiter.requestedTokens: 1  # 每次请求消耗的令牌数
##                key-resolver: "#{@userKeyResolver}"  # 自定义 KeyResolver
#            - name: CircuitBreaker
#              args:
#                name: orderServiceBreaker
#                fallbackUri: forward:/fallback/order

  redis:
    host: ${REDIS_HOST:localhost}  # ✅ 支持环境变量，默认 localhost
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 1000ms

